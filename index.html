<!DOCTYPE html>
<!--
  The host interface's document.

  `lang` is set because the interface is bilingual and the wrong value makes screen readers choose the wrong voice, and
  because the first paint's text direction is decided before any script runs.

  `viewport-fit=cover` is what makes `env(safe-area-inset-*)` non-zero on a phone with a notch — without it the bottom
  bar sits under the gesture area ([28 §4 R16](../../design-docs/28-app-ui.md) item 1).

  The inline block is limited to three things on purpose ([28 §3 R8](../../design-docs/28-app-ui.md)): `color-scheme`, the
  page colour and the text colour. It exists because the first frame must not wait for an async stylesheet, and those
  three are the only things the first frame needs — the reset arrives with the stylesheet. The seven
  `--bg`/`--panel`/`--border`/… variables that used to live here were a second design system growing in the one place no
  guard reads; the tokens are declared once in `@synra/theme` and reach the page through UnoCSS preflight (R6).

  ★ The interface is dark-only, so `<html>` carries no theme class: `color-scheme: dark` is the whole statement, and a
    future light theme would be a class rather than the default (R22's two purples are chosen for a dark ground).

  ★ The two literals below are checked against the theme's own tokens by the host's shape guard ([28 §13.1] guard 3), so
    they cannot drift from `--synra-screen` / `--synra-ink`.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Synra</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0813;
        color: #ece7f8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
