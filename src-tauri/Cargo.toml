[package]
name = "synra-app"
description = "The Tauri shell: the window, the WebView and the commands the interface calls"

version.workspace = true

edition.workspace = true

rust-version.workspace = true

license.workspace = true

repository.workspace = true

authors.workspace = true

# ★ `src-tauri` 是**独立 workspace**，不是 `synra-rust-core` 的成员。
#
# 理由是设计文档 06 §4.1 给的判据：宿主是否只依赖内核的公开 API 且没有平台特定的重型依赖。CLI/daemon 是，
# Tauri 应用不是 —— 它要 WebView2、要 NDK、要自己的 CI。把 Tauri 拖进内核仓库会让内核的依赖图和 CI 都背上
# 一个与应用无关的东西，而 §4.1 的表已经明确把它判给 app 仓库。
#
# 代价是内核的 crate 在这里只能按路径引用：发布时换成版本号依赖，应用仓库才不需要跟着内核仓库的目录走。

[workspace]

# ★ 这个 workspace 只有一个成员：应用壳。
#
# 内核的 crate 通过路径引入而不是 workspace 依赖，所以内核仓库的版本改动不需要同步改这里的 `members`。
[workspace.package]
version = "0.1.0"
edition = "2024"
# ★ **1.90，不是 1.88 —— 而升它的原因值得写下来，因为它是一次被依赖逼出来的决定。**
#
# 2026-10-16：`pnpm tauri dev` 报 "Found version mismatched Tauri packages"（`tauri 2.11.6` vs
# `@tauri-apps/api 2.12.3`）。Tauri 的 CLI 要求两边的 major/minor 相同，所以要让它们对齐 ——
# 而**升不上去的不是 npm，是 Rust**：`tauri 2.12.x` 与 `tauri-build 2.7.x` 的 MSRV 是 **1.90**，
# 而这里写着 1.88，于是 `cargo update -p tauri` 会安静地什么都不做
# （它说的是 "Locking 0 packages to latest Rust 1.88 compatible versions" —— 那句话就是 MSRV 在挡）。
# 本机工具链是 1.98，所以抬到 1.90 不阻塞任何东西；代价是贡献者需要 Rust ≥ 1.90 才能构建外壳。
#
# 另一条路是**把 npm 侧降到 2.11.x**（`@tauri-apps/api@2.11.1` + `@tauri-apps/cli@2.11.5`）：它不需要
# 重编译任何 Rust，也不用抬 MSRV。没走那条路，是因为 JS 侧被升到 2.12 是一个已经做出的选择，
# 而"把新的降回去"会让下一个人再升一次 —— 同一个决定做两遍。
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/synra-rs/synra-app"
authors = [ "Synra contributors" ]

[workspace.dependencies]

[lib]
# ★ **这个名字与 bin 的产物名撞车，这是已知的，而修它的时机是有代价的。**
#
# `[[bin]] name = "synra-app"` 与 `[lib] name = "synra_app"` 在 Cargo 里归一到同一个产物名，于是 dev 构建会报
# `output filename collision at target/debug/synra_app.pdb`（两条 note，指 bin 与 lib 的 pdb 同名）。
# Tauri 的模板正是为此把 lib 命名成 `<crate>_lib`。
#
# 没现在改的原因：`gen/android` 里 `Rust.kt` 写着 `System.loadLibrary("synra_app")`，`.so` 也按这个名字产出 ——
# 改名必须连着重新生成移动端工程（需要 Android SDK），否则 Android 会在 JNI 那一层断掉，而**它断掉的样子
# 不是编译错误**。pdb 撞车的实际代价只是"其中一个目标的调试符号被覆盖"（dev 构建、无功能影响）。
# 所以正确的时机是**下一次重新生成移动端工程时一起做**，而不是现在单独改这一行。
name = "synra_app"
path = "src/lib.rs"
# ★ `cdylib` 与 `staticlib` 是 Android 需要的**产物形状**，不是可选优化。
#
# 移动端没有「可执行文件入口」这回事：`gen/android` 里的 `MainActivity` 通过 JNI 调进一个动态库，Tauri 的
# `mobile_entry_point` 宏就是那个 `start_app` 符号的产地。默认的 `rlib` 只产出一个给 Rust 链接器看的归档，Java
# 侧找不到任何符号，构建会在 Gradle 的 `cargoBuild` 之后以 "symbol not found" 收场 —— 而那条报错不会提到
# `crate-type`。桌面端多出来的 `.dll`/`.a` 是这次改动的代价，可以接受。
crate-type = [ "lib", "cdylib", "staticlib" ]
# ★ 只有库，没有窗口。
#
# 命令的实现在这一层，`main.rs` 只是把每个函数包成一个 `#[tauri::command]`。这样切分的理由不是整洁，是可测：
# 单元测试跑的是 lib，不需要 WebView2、不需要窗口、不需要 `tauri` 被编译进来 —— 而一个跑不起来的测试等于没有测试。

[[bin]]
name = "synra-app"
path = "src/main.rs"
required-features = [ "tauri-shell" ]

[features]
default = [ "tauri-shell" ]
# ★ 外壳是可选的，这样 `cargo test --no-default-features` 不编译 Tauri。
#
# 这不是为了省时间：Tauri 的构建是最容易失败的一个（WebView2 的安装、NDK、系统库），把它放进测试的依赖路径里，
# 一个环境问题就会让整套逻辑测试跑不起来，而失败的却是逻辑。逻辑不该为平台的缺失买单。
tauri-shell = [
  "dep:tauri",
  "dep:tauri-build"
]

[dependencies]
synra-core = { path = "../../synra-rust-core/crates/synra-core" }
# The HTTP client `network-fetch` needs. A host-side crate on purpose: putting it in the kernel would drag a TLS stack into
# a crate that is cross-compiled for Android — see the crate's own `Cargo.toml`.
synra-fetch = { path = "../../synra-rust-core/crates/synra-fetch" }
synra-ipc = { path = "../../synra-rust-core/crates/synra-ipc" }
synra-protocol = { path = "../../synra-rust-core/crates/synra-protocol" }
synra-capability = { path = "../../synra-rust-core/crates/synra-capability" }
synra-store = { path = "../../synra-rust-core/crates/synra-store" }
synra-observe = { path = "../../synra-rust-core/crates/synra-observe" }
synra-platform = { path = "../../synra-rust-core/crates/synra-platform" }
synra-plugin-api = { path = "../../synra-rust-core/crates/synra-plugin-api" }
# The kernel holds the plugin seam but not an engine, so the shell brings one — the same split the daemon makes.
synra-plugin-host = { path = "../../synra-rust-core/crates/synra-plugin-host", features = [ "wasm-runtime" ] }
parking_lot = "0.12"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros"
] }
tauri = { version = "2", optional = true, features = [] }

[build-dependencies]

# ★ `tauri-build` is optional, and it has to be.
#
# `tauri-build::build()` calls `tauri_build::is_dev()`, which reads `DEP_TAURI_DEV` — a variable the **`tauri` crate's**
# own build script emits, because `tauri` declares `links = "Tauri"`. So `tauri-build` panics with "missing `cargo:dev`
# instruction" whenever `tauri` is out of the dependency graph, which is exactly what `--no-default-features` does.
#
# That is worth writing down because it looks like an optionality mistake when you meet it: it reads as a version
# mismatch ("please update tauri to latest") and it is not — the dependency is real and the gating is the only correct
# arrangement.
#
# ★ **2026-10-16：那句话里的版本号（当时写的是 `tauri` 2.11.6）已经过期，而更值得记的是"版本相关的报错有两种"。**
#   ① **假的那种**（本节上面描述的）：`--no-default-features` 让 `tauri` 离开依赖图，`tauri-build` 于是 panic，
#      文案里带"update to latest" —— 依赖关系的问题，不是版本问题。
#   ② **真的那种**（同一天遇到的）：`pnpm tauri dev` 报 "Found version mismatched Tauri packages"
#      （`tauri 2.11.6` vs `@tauri-apps/api 2.12.3`）。那是 CLI 在比 major/minor，而它当时升不上去的原因是
#      **MSRV**（见 `[workspace.package] rust-version` 那一段）。现在两边都是 2.12。
tauri-build = { version = "2", optional = true, features = [ ] }

# The lint set mirrors the kernel's for the reasons in `synra-rust-core/AGENT.md`: the shell is where a command can
# quietly grow into a business rule, and the shell is the one layer with a window on it.
[lints.clippy]
# ★ Allowed once, rather than silenced at each call site.
#
# `IpcError` is the error type of the whole command surface: it carries the message key **and** its parameters, so the
# interface can build a sentence in the user's own language rather than receiving one already assembled. That makes it
# larger than the values it accompanies, which is what this lint measures — and all fourteen wrappers in `main.rs` trip
# it for that same reason. Fourteen `allow`s would be fourteen places for a new one to hide; one here means a *new*
# warning in this crate is visible.
result_large_err = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
use_self = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
needless_pass_by_value = "deny"
significant_drop_tightening = "deny"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
