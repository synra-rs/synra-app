name: source-size

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  source-size:
    name: source-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-source-size.ts
