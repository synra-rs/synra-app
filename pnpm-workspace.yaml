minimumReleaseAgeExcludePrune: true

# This repository is one package, and the client library it is built against lives in a sibling checkout.
#
# ★ The client library is reached by `overrides: link:` and **not** by a `packages:` glob.
#
# The first version of this file listed `../synra-js/packages/*` as workspace members, and the two repositories then
# held each other's packages: this one depended on the library's, the library's depended on this one's, and pnpm
# resolved that by nesting a `node_modules` inside a `node_modules` inside a `node_modules` — indefinitely. The
# immediate symptom is that any recursive command over this directory never finishes; the cause is that a recursive
# *dependency* was expressed as a recursive *directory*.
#
# An override says the one thing that is true: when something asks for `@synra/client`, resolve it to this directory.
minimumReleaseAgeExclude:
  - pinia

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - .

# Local development against the sibling checkout. `link:` points at the directory holding the `package.json` rather than
# at a source file, and the path is relative to *this* file rather than to the shell's working directory.
#
# In CI the two are versioned dependencies; this file is what makes a change to a protocol type visible here in the same
# edit.
overrides:
  '@synra/client': link:../synra-js/packages/client
  '@synra/protocol': link:../synra-js/packages/protocol
  '@synra/theme': link:../synra-js/packages/theme

# `esbuild` ships a native binary built by a postinstall script, and `vitest` does not run without it. pnpm 10 refuses
# to run a dependency's install scripts unless it is named here, which is a supply-chain default worth keeping.
allowBuilds:
  # ★ `ant-design-vue` 带进来 `core-js`，而 pnpm 在装它时**自己往这个文件里写了一行占位**
  #   （`core-js: set this to true or false`）。那个 postinstall 是 core-js 的捐赠横幅，
  #   对功能没有任何作用，所以显式关掉 —— 保持"依赖的脚本默认不跑"这条默认，而不是为了消掉一条提示把它打开。
  core-js: false
  esbuild: true
